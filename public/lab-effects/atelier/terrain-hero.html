<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>等高线山脉 · Hero</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #131216; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
</style>
<!-- CDN import map -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- 基础 ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f14);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 19, 32);

/* 轨道控制:阻尼 + 锁定俯仰,只允许水平环绕,禁用缩放 */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enableZoom = false;
controls.enablePan = false;
controls.target.set(0, 1.5, 0);
controls.update();
const polar = controls.getPolarAngle();
controls.minPolarAngle = polar;   // 锁定俯仰角
controls.maxPolarAngle = polar;
controls.mouseButtons.RIGHT = null; // 右键留给岩浆激光

/* ---------- 生成无缝 Perlin 噪声位移贴图 (CPU 生成一次) ---------- */
function makePerlinTexture(size = 512) {
  const p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; }
  const perm = new Uint8Array(512);
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const G = [[1,0],[-1,0],[0,1],[0,-1],[0.7071,0.7071],[-0.7071,0.7071],[0.7071,-0.7071],[-0.7071,-0.7071]];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  // 周期化梯度 → 贴图可平铺(RepeatWrapping 下无接缝)
  function noise(x, y, per) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const g = (ix, iy) => G[perm[(perm[iy % per] + (ix % per)) & 255] & 7];
    const dot = (ix, iy, dx, dy) => { const gr = g(ix, iy); return gr[0] * dx + gr[1] * dy; };
    const u = fade(xf), v = fade(yf);
    const a = dot(xi, yi, xf, yf) + (dot(xi + 1, yi, xf - 1, yf) - dot(xi, yi, xf, yf)) * u;
    const b = dot(xi, yi + 1, xf, yf - 1) + (dot(xi + 1, yi + 1, xf - 1, yf - 1) - dot(xi, yi + 1, xf, yf - 1)) * u;
    return a + (b - a) * v;
  }
  const data = new Uint8Array(size * size);
  const vals = new Float32Array(size * size);
  let mn = 1e9, mx = -1e9;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    let f = 3, amp = 1, sum = 0, tot = 0;      // 5 个八度 fbm,细节直接烘焙进贴图
    for (let o = 0; o < 5; o++) {
      sum += noise(x / size * f, y / size * f, f) * amp;
      tot += amp; amp *= 0.5; f *= 2;
    }
    const v = sum / tot;
    vals[y * size + x] = v;
    if (v < mn) mn = v; if (v > mx) mx = v;
  }
  for (let i = 0; i < vals.length; i++) data[i] = ((vals[i] - mn) / (mx - mn)) * 255; // 归一化到 0..1
  const tex = new THREE.DataTexture(data, size, size, THREE.RedFormat, THREE.UnsignedByteType);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.magFilter = tex.minFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return tex;
}
const noiseTex = makePerlinTexture(256);

/* ---------- 莫兰迪色系 1D 渐变纹理 ---------- */
function makeGradientTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 1;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 256, 0);
  g.addColorStop(0.00, '#131a2e'); // 墨蓝(谷底)
  g.addColorStop(0.30, '#22335a');
  g.addColorStop(0.52, '#3d5878'); // 深青
  g.addColorStop(0.72, '#7a8894'); // 岩灰
  g.addColorStop(0.87, '#c0ac85'); // 灰金
  g.addColorStop(1.00, '#f3e6c2'); // 香槟(峰顶)
  ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 1);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  return tex;
}
const gradTex = makeGradientTexture();

/* ---------- 地形:细分平面 + 顶点位移 ---------- */
const SIZE = 64, SEG = 192, AMP = 7.5;
const terrainUniforms = {
  uNoise:      { value: noiseTex },
  uGradient:   { value: gradTex },
  uTime:       { value: 0 },
  uAmp:        { value: AMP },
  uHeat:       { value: null },
  uMouse:      { value: new THREE.Vector3(0, 0, 0) },
  uMouseActive:{ value: 0 },
  uReveal:     { value: 0 }
};
const terrainMat = new THREE.ShaderMaterial({
  glslVersion: THREE.GLSL3,
  uniforms: terrainUniforms,
  vertexShader: /* glsl */`
    uniform sampler2D uNoise;
    uniform float uTime;
    uniform float uAmp;
    out vec2 vUv;
    out float vH;
    out vec3 vWorld;
    out vec3 vNormal;
    // 地形高度:大体量平滑起伏,优雅不碎
    float height(vec2 uv2, vec2 flow) {
      float b1 = texture(uNoise, uv2 * 0.8 + flow).r;          // 大尺度主体
      float b2 = texture(uNoise, uv2 * 1.8 - flow * 1.3).r;    // 次级起伏
      float h = b1 * 0.75 + b2 * 0.25;
      return pow(h, 1.25);   // 压平谷地、抬升峰顶
    }
    void main() {
      vUv = uv;
      // 噪声偏移随时间缓慢流动
      vec2 flow = vec2(uTime * 0.012, uTime * 0.007);
      float h = height(uv, flow);
      vH = h;
      // 有限差分求平滑法线(避免屏幕空间导数的三角面感)
      float e = 1.0 / 256.0;
      float hx = height(uv + vec2(e, 0.0), flow) - height(uv - vec2(e, 0.0), flow);
      float hy = height(uv + vec2(0.0, e), flow) - height(uv - vec2(0.0, e), flow);
      float cell = 2.0 * e * 64.0; // uv 差分对应的局部距离(平面尺寸 64)
      vec3 nLocal = normalize(vec3(-hx * uAmp / cell, -hy * uAmp / cell, 1.0));
      vNormal = normalize(mat3(modelMatrix) * nLocal);
      vec3 p = position + normal * h * uAmp; // 沿法线顶起
      vec4 wp = modelMatrix * vec4(p, 1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: /* glsl */`
    precision highp float;
    #define PI 3.14159265
    uniform sampler2D uGradient;
    uniform sampler2D uNoise;
    uniform sampler2D uHeat;
    uniform vec3 uMouse;
    uniform float uMouseActive;
    uniform float uReveal;
    in vec2 vUv;
    in float vH;
    in vec3 vWorld;
    in vec3 vNormal;
    out vec4 fragColor;
    // 抗锯齿等高线:位移值取 sin,fwidth 求屏幕空间导数做 smoothstep 描边
    float contour(float t, float bold) {
      float s = abs(sin(t * PI));
      float aa = fwidth(t) * PI * bold;
      return 1.0 - smoothstep(0.0, aa, s);
    }
    void main() {
      float levels = 18.0;
      float minor = contour(vH * levels, 1.1);          // 发丝细线
      float major = contour(vH * levels * 0.25, 1.8);   // 每 4 条一根主线
      float line = max(minor * 0.4, major * 0.85);

      // 高度 → 莫兰迪渐变
      vec3 grad = texture(uGradient, vec2(clamp(vH, 0.02, 0.98), 0.5)).rgb;

      // 平滑法线漫反射,让隆起有明暗立体感
      float diff = clamp(dot(normalize(vNormal), normalize(vec3(0.35, 0.8, 0.45))), 0.0, 1.0);

      vec3 col = grad * (0.3 + 0.5 * diff);     // 底色带高度明暗,颜色读得出
      col += vec3(0.96, 0.90, 0.76) * line * (0.4 + 0.6 * vH); // 香槟色等高线,越高越亮

      // 掠射高光:克制的丝绸质感
      vec3 V = normalize(cameraPosition - vWorld);
      vec3 Hv = normalize(normalize(vec3(-0.4, 0.55, 0.6)) + V);
      col += vec3(0.9, 0.86, 0.76) * pow(max(dot(normalize(vNormal), Hv), 0.0), 60.0) * 0.12;

      // 探照光点(默认状态):点亮鼠标周围
      float dm = distance(vWorld.xz, uMouse.xz);
      float glow = exp(-dm * dm * 0.03) * uMouseActive;
      float spotL = exp(-dm * dm * 0.7) * uMouseActive;
      col += grad * (glow * 0.3 + line * glow * 1.0);
      col += vec3(0.94, 0.89, 0.80) * spotL * 1.2;

      // 远处淡入雾霭:偏亮的蓝灰色,拉开纵深但不发黑
      float fogF = smoothstep(30.0, 64.0, distance(vWorld.xz, cameraPosition.xz));
      col = mix(col, vec3(0.20, 0.24, 0.33), fogF * 0.55);

      // 岩浆灼烧痕迹:冷却时碎裂成龟裂余烬,而非均匀色块
      float heat = texture(uHeat, vUv).r;
      float h01 = clamp(heat, 0.0, 1.0);
      float crack = texture(uNoise, vUv * 22.0).r;                            // 龟裂纹理
      float ember = h01 * smoothstep(0.04, 0.5, h01 + (crack - 0.55) * 0.5);  // 冷却时只剩裂缝发光
      col = mix(col, col * vec3(0.4, 0.26, 0.2), min(h01 * 1.3, 0.8));        // 烧焦基底
      vec3 lava = mix(vec3(0.5, 0.03, 0.0), vec3(1.0, 0.38, 0.05), ember);    // 暗红→橙
      col += lava * ember * 2.6;
      col += vec3(1.0, 0.8, 0.5) * smoothstep(0.8, 1.05, heat * (0.8 + 0.4 * crack)) * 1.8; // 白热核心

      // 入场扫描:从左到右逐列点亮(按列量化 + 噪声错位)
      float colId = floor(vUv.x * 128.0) / 128.0;
      float stag = texture(uNoise, vec2(colId * 3.7, 0.13)).r * 0.1;
      float sweep = smoothstep(colId + stag - 0.12, colId + stag, uReveal * 1.3 - 0.06);
      col *= sweep;

      fragColor = vec4(col, 1.0);
    }`
});
const terrain = new THREE.Mesh(new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG), terrainMat);
terrain.rotation.x = -Math.PI / 2;
scene.add(terrain);

/* ---------- 岩浆激光束:噪声流动条纹 + 侧缘衰减,按住右键从天而降 ---------- */
const beamUniforms = { uTime: { value: 0 }, uNoise: { value: noiseTex }, uIntensity: { value: 0 } };
const beamMat = new THREE.ShaderMaterial({
  glslVersion: THREE.GLSL3,
  uniforms: beamUniforms,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  vertexShader: /* glsl */`
    out vec2 vUv2; out vec3 vN; out vec3 vV;
    void main() {
      vUv2 = uv;
      vN = normalize(mat3(modelMatrix) * normal);
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vV = normalize(cameraPosition - wp.xyz);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform sampler2D uNoise; uniform float uTime; uniform float uIntensity;
    in vec2 vUv2; in vec3 vN; in vec3 vV;
    out vec4 fragColor;
    void main() {
      // 两层不同速度向下流动的熔岩条纹
      float s1 = texture(uNoise, vec2(vUv2.x * 2.0, vUv2.y * 5.0 - uTime * 1.8)).r;
      float s2 = texture(uNoise, vec2(vUv2.x * 6.0 + 0.37, vUv2.y * 11.0 - uTime * 3.6)).r;
      // 面向视线中心亮、圆柱侧缘淡出
      float facing = abs(dot(normalize(vN), normalize(vV)));
      float edge = smoothstep(0.15, 0.85, facing);
      vec3 col = mix(vec3(0.5, 0.03, 0.0), vec3(1.0, 0.42, 0.1), s1 * 0.75 + 0.25);
      col += vec3(1.0, 0.8, 0.5) * pow(s2, 3.0) * 1.2;   // 白热流火
      float a = edge * (0.55 + 0.45 * s1) * uIntensity;
      fragColor = vec4(col * 1.6, a);
    }`
});
const beam = new THREE.Group();
const coreGeo = new THREE.CylinderGeometry(0.16, 0.3, 80, 24, 1, true);
coreGeo.translate(0, -40, 0);   // 顶端为原点,便于"从上往下"伸出
const beamCore = new THREE.Mesh(coreGeo, beamMat);
beam.add(beamCore);   // 去掉外层光晕圆柱,辉光交给 Bloom
beam.position.y = 74;   // 光束顶端高度
beam.visible = false;
scene.add(beam);

/* ---------- 鼠标拾取:射线求交 y=0 平面 ---------- */
const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -2.5);
const ndc = new THREE.Vector2();
const mouseTarget = new THREE.Vector3();
const mouseSmooth = new THREE.Vector3();
let mouseActiveTarget = 0;
let mouseActive = 0;
renderer.domElement.addEventListener('pointermove', e => {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(groundPlane, hit)) { mouseTarget.copy(hit); mouseActiveTarget = 1; }
});
renderer.domElement.addEventListener('pointerleave', () => { mouseActiveTarget = 0; });
let laserOn = 0, laserS = 0;   // 按住右键 → 岩浆激光
renderer.domElement.addEventListener('pointerdown', e => { if (e.button === 2) laserOn = 1; });
addEventListener('pointerup', e => { if (e.button === 2) laserOn = 0; });
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- 后处理:Bloom(多级 ping-pong 高斯模糊) + 暗角 + 胶片噪点 ---------- */
const rtOpt = { type: THREE.HalfFloatType, format: THREE.RGBAFormat, depthBuffer: false };
let sceneRT = new THREE.WebGLRenderTarget(1, 1, { ...rtOpt, depthBuffer: true });
const LEVELS = 3;
let rtA = [], rtB = [];
for (let i = 0; i < LEVELS; i++) { rtA.push(new THREE.WebGLRenderTarget(1, 1, rtOpt)); rtB.push(new THREE.WebGLRenderTarget(1, 1, rtOpt)); }

const quadVert = /* glsl */`
  in vec3 position;
  out vec2 vUv;
  void main() { vUv = position.xy * 0.5 + 0.5; gl_Position = vec4(position.xy, 1.0, 1.0); }`;

function postMat(frag, uniforms) {
  return new THREE.RawShaderMaterial({ glslVersion: THREE.GLSL3, uniforms, vertexShader: quadVert, fragmentShader: frag, depthTest: false, depthWrite: false });
}
// 亮部提取
const brightMat = postMat(/* glsl */`
  precision highp float;
  uniform sampler2D tSrc;
  in vec2 vUv; out vec4 fragColor;
  void main() {
    vec3 c = texture(tSrc, vUv).rgb;
    float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
    fragColor = vec4(c * smoothstep(0.45, 0.85, l), 1.0);
  }`, { tSrc: { value: null } });
// 可分离高斯模糊(9 tap)
const blurMat = postMat(/* glsl */`
  precision highp float;
  uniform sampler2D tSrc;
  uniform vec2 uDir; // 单方向纹素步长
  in vec2 vUv; out vec4 fragColor;
  void main() {
    float w[5] = float[](0.227027, 0.1945946, 0.1216216, 0.054054, 0.016216);
    vec3 c = texture(tSrc, vUv).rgb * w[0];
    for (int i = 1; i < 5; i++) {
      c += texture(tSrc, vUv + uDir * float(i)).rgb * w[i];
      c += texture(tSrc, vUv - uDir * float(i)).rgb * w[i];
    }
    fragColor = vec4(c, 1.0);
  }`, { tSrc: { value: null }, uDir: { value: new THREE.Vector2() } });
// 降采样拷贝
const copyMat = postMat(/* glsl */`
  precision highp float;
  uniform sampler2D tSrc;
  in vec2 vUv; out vec4 fragColor;
  void main() { fragColor = texture(tSrc, vUv); }`, { tSrc: { value: null } });
// 灼烧热度模拟:上一帧衰减(冷却) + 激光笔刷注入热量,ping-pong 累积
const heatOpt = { type: THREE.HalfFloatType, format: THREE.RGBAFormat, depthBuffer: false };
let heatRead = new THREE.WebGLRenderTarget(512, 512, heatOpt);
let heatWrite = new THREE.WebGLRenderTarget(512, 512, heatOpt);
const heatMat = postMat(/* glsl */`
  precision highp float;
  uniform sampler2D tPrev;
  uniform vec2 uBrush;   // 激光落点(地形 UV)
  uniform float uActive;
  in vec2 vUv; out vec4 fragColor;
  void main() {
    float h = texture(tPrev, vUv).r * 0.9945;    // 缓慢冷却消退
    float d = distance(vUv, uBrush) * 64.0;       // 换算世界距离
    h += exp(-d * d * 4.0) * uActive * 0.6;      // 注入热量(细窄熔痕)
    fragColor = vec4(min(h, 1.1), 0.0, 0.0, 1.0);
  }`, { tPrev: { value: null }, uBrush: { value: new THREE.Vector2(-10, -10) }, uActive: { value: 0 } });
// 合成:场景 + Bloom + 暗角 + 噪点
const compUniforms = {
  tScene: { value: null }, tB0: { value: null }, tB1: { value: null }, tB2: { value: null },
  uTime: { value: 0 }
};
const compMat = postMat(/* glsl */`
  precision highp float;
  uniform sampler2D tScene, tB0, tB1, tB2;
  uniform float uTime;
  in vec2 vUv; out vec4 fragColor;
  float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
  void main() {
    vec3 col = texture(tScene, vUv).rgb;
    vec3 bloom = texture(tB0, vUv).rgb * 0.55 + texture(tB1, vUv).rgb * 0.4 + texture(tB2, vUv).rgb * 0.3;
    col += bloom * 0.7;
    col = 1.0 - exp(-col * 1.5);               // 简单色调映射
    float d = distance(vUv, vec2(0.5));
    col *= 0.74 + 0.26 * smoothstep(0.85, 0.3, d);   // 暗角 vignette(减弱)
    col += (hash(gl_FragCoord.xy + fract(uTime) * 100.0) - 0.5) * 0.035; // 胶片噪点
    fragColor = vec4(col, 1.0);
  }`, compUniforms);

// 全屏三角形
const quadGeo = new THREE.BufferGeometry();
quadGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-1, -1, 0, 3, -1, 0, -1, 3, 0]), 3));
const quad = new THREE.Mesh(quadGeo, copyMat);
quad.frustumCulled = false;
const postScene = new THREE.Scene();
postScene.add(quad);
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

function blit(mat, target) {
  quad.material = mat;
  renderer.setRenderTarget(target);
  renderer.render(postScene, postCam);
}
// 初始化清空热度图
renderer.setRenderTarget(heatRead); renderer.clear();
renderer.setRenderTarget(heatWrite); renderer.clear();
renderer.setRenderTarget(null);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const pr = renderer.getPixelRatio();
  sceneRT.setSize(w * pr, h * pr);
  for (let i = 0; i < LEVELS; i++) {
    const s = Math.pow(2, i + 1);
    rtA[i].setSize(Math.max(1, w * pr / s | 0), Math.max(1, h * pr / s | 0));
    rtB[i].setSize(rtA[i].width, rtA[i].height);
  }
}
addEventListener('resize', resize);
resize();

/* ---------- 动画循环 ---------- */
const clock = new THREE.Clock();
const startTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  terrainUniforms.uTime.value = t;
  compUniforms.uTime.value = t;

  // 入场过渡:0 → 1(约 3 秒,smooth 缓动)
  const raw = Math.min((performance.now() - startTime) / 3000, 1);
  terrainUniforms.uReveal.value = raw * raw * (3 - 2 * raw);

  // 鼠标平滑跟随;探照光点(默认) / 岩浆激光(按住右键)
  mouseSmooth.lerp(mouseTarget, 0.18);
  mouseActive += (mouseActiveTarget - mouseActive) * 0.12;
  laserS += (laserOn - laserS) * 0.16;              // 光柱从上而下伸出/收回
  terrainUniforms.uMouse.value.copy(mouseSmooth);
  terrainUniforms.uMouseActive.value = mouseActive * (1 - laserS); // 激光时收起探照点

  beam.visible = laserS > 0.02;
  beam.position.x = mouseSmooth.x;
  beam.position.z = mouseSmooth.z;
  beam.scale.y = Math.max(laserS, 0.001);
  beamUniforms.uTime.value = t;
  beamUniforms.uIntensity.value = laserS;

  // 热度图 ping-pong:冷却衰减 + 激光触地后注热
  heatMat.uniforms.tPrev.value = heatRead.texture;
  heatMat.uniforms.uBrush.value.set(mouseSmooth.x / 64 + 0.5, 0.5 - mouseSmooth.z / 64);
  heatMat.uniforms.uActive.value = mouseActive * Math.max(0, (laserS - 0.8) / 0.2);
  blit(heatMat, heatWrite);
  [heatRead, heatWrite] = [heatWrite, heatRead];
  terrainUniforms.uHeat.value = heatRead.texture;

  controls.update();

  // 1. 场景 → RT
  renderer.setRenderTarget(sceneRT);
  renderer.render(scene, camera);

  // 2. 亮部提取 → 多级 ping-pong 高斯模糊
  brightMat.uniforms.tSrc.value = sceneRT.texture;
  blit(brightMat, rtA[0]);
  for (let i = 0; i < LEVELS; i++) {
    if (i > 0) { copyMat.uniforms.tSrc.value = rtA[i - 1].texture; blit(copyMat, rtA[i]); }
    for (let p = 0; p < 2; p++) { // 每级两轮 H/V ping-pong
      blurMat.uniforms.uDir.value.set(1 / rtA[i].width, 0);
      blurMat.uniforms.tSrc.value = rtA[i].texture; blit(blurMat, rtB[i]);
      blurMat.uniforms.uDir.value.set(0, 1 / rtA[i].height);
      blurMat.uniforms.tSrc.value = rtB[i].texture; blit(blurMat, rtA[i]);
    }
  }

  // 3. 合成输出到屏幕
  compUniforms.tScene.value = sceneRT.texture;
  compUniforms.tB0.value = rtA[0].texture;
  compUniforms.tB1.value = rtA[1].texture;
  compUniforms.tB2.value = rtA[2].texture;
  blit(compMat, null);
}
animate();
</script>
</body>
</html>
