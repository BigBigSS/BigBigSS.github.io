<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>诗词轮换 — 十种字符级转场</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #F2F3F5; }
  body { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }

  #label {
    position: fixed; top: 28px; left: 36px;
    font-family: 'SF Mono', ui-monospace, Menlo, monospace;
    font-size: 13px; letter-spacing: 0.35em; color: #B4B7BC; user-select: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.08em; padding: 0 40px 90px;
  }
  #stage .line { display: flex; justify-content: center; white-space: nowrap; }
  #stage .ch {
    font-size: clamp(40px, 7vw, 88px);
    font-weight: 700; color: #17181A;
    line-height: 1.28; letter-spacing: 0.02em;
    display: inline-block;
    will-change: transform, opacity, filter;
  }

  /* ============ 底部效果切换栏 ============ */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 14px 16px 18px;
    background: linear-gradient(to top, rgba(242,243,245,0.96), rgba(242,243,245,0));
  }
  #desc {
    font-family: 'SF Mono', ui-monospace, Menlo, monospace;
    font-size: 11px; letter-spacing: 0.14em; color: #8A8E95; user-select: none;
  }
  #btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  #btns button {
    padding: 6px 16px;
    border: 1px solid rgba(23,24,26,0.22); border-radius: 999px;
    background: transparent; color: #17181A;
    font-family: inherit; font-size: 13px; letter-spacing: 0.08em;
    cursor: pointer;
    transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
  }
  #btns button:hover { border-color: #17181A; }
  #btns button.active { background: #17181A; color: #F2F3F5; border-color: #17181A; }

  /* ============ 十组进出场 keyframes（与设计稿一致） ============ */
  @keyframes charOut {
    0% { opacity: 1; transform: translateY(0); filter: blur(0); }
    100% { opacity: 0; transform: translateY(-26px); filter: blur(6px); }
  }
  @keyframes charIn {
    0% { opacity: 0; transform: translateY(30px); filter: blur(8px); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
  @keyframes inkOut {
    0% { opacity: 1; filter: blur(0); transform: scale(1); }
    100% { opacity: 0; filter: blur(16px); transform: scale(1.06); }
  }
  @keyframes inkIn {
    0% { opacity: 0; filter: blur(16px); transform: scale(1.08); }
    100% { opacity: 1; filter: blur(0); transform: scale(1); }
  }
  @keyframes flipOut {
    0% { opacity: 1; transform: perspective(800px) rotateX(0); }
    100% { opacity: 0; transform: perspective(800px) rotateX(-88deg); }
  }
  @keyframes flipIn {
    0% { opacity: 0; transform: perspective(800px) rotateX(88deg); }
    100% { opacity: 1; transform: perspective(800px) rotateX(0); }
  }
  @keyframes riseOut {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-118%); opacity: 1; }
  }
  @keyframes riseIn {
    0% { transform: translateY(118%); opacity: 1; }
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes scatterOut {
    0% { opacity: 1; transform: translate(0, 0) rotate(0deg); filter: blur(0); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); filter: blur(7px); }
  }
  @keyframes scatterIn {
    0% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); filter: blur(7px); }
    100% { opacity: 1; transform: translate(0, 0) rotate(0deg); filter: blur(0); }
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.1); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes popOut {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.1); }
  }
  @keyframes glitchIn {
    0% { opacity: 0; transform: translate(0, 0); }
    10% { opacity: 1; transform: translate(-0.06em, 0.03em); clip-path: inset(0 0 55% 0); text-shadow: 0.06em 0 #FF3B6B, -0.06em 0 #3B7BFF; }
    30% { opacity: 1; transform: translate(0.05em, -0.02em); clip-path: inset(45% 0 0 0); text-shadow: -0.05em 0 #FF3B6B, 0.05em 0 #3B7BFF; }
    50% { opacity: 1; transform: translate(-0.03em, 0.01em); clip-path: inset(0 0 20% 0); text-shadow: 0.03em 0 #FF3B6B, -0.03em 0 #3B7BFF; }
    70% { opacity: 1; transform: translate(0.02em, 0); clip-path: inset(10% 0 0 0); text-shadow: 0.02em 0 #FF3B6B, -0.02em 0 #3B7BFF; }
    100% { opacity: 1; transform: translate(0, 0); clip-path: inset(0); text-shadow: none; }
  }
  @keyframes glitchOut {
    0% { opacity: 1; transform: translate(0, 0); clip-path: inset(0); }
    25% { opacity: 1; transform: translate(0.04em, -0.02em); clip-path: inset(0 0 35% 0); text-shadow: -0.05em 0 #FF3B6B, 0.05em 0 #3B7BFF; }
    55% { opacity: 1; transform: translate(-0.05em, 0.02em); clip-path: inset(50% 0 0 0); text-shadow: 0.06em 0 #FF3B6B, -0.06em 0 #3B7BFF; }
    80% { opacity: 1; transform: translate(0.03em, 0); clip-path: inset(0 0 60% 0); text-shadow: 0.04em 0 #FF3B6B, -0.04em 0 #3B7BFF; }
    100% { opacity: 0; transform: translate(0, 0); }
  }
  @keyframes typeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }
  @keyframes typeOut {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes vortexIn {
    0% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.3); filter: blur(4px); }
    100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); filter: blur(0); }
  }
  @keyframes vortexOut {
    0% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); filter: blur(0); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.3); filter: blur(4px); }
  }
  @keyframes fallIn {
    0% { opacity: 0; transform: translateY(-1.4em) rotate(var(--rot)); }
    55% { opacity: 1; transform: translateY(0) rotate(0deg); }
    72% { transform: translateY(-0.12em) rotate(0deg); }
    86% { transform: translateY(0) rotate(0deg); }
    94% { transform: translateY(-0.04em) rotate(0deg); }
    100% { opacity: 1; transform: translateY(0) rotate(0deg); }
  }
  @keyframes fallOut {
    0% { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(0.9em) rotate(var(--rot)); }
  }
</style>
</head>
<body>
<div id="label">02 / IDENTITÉ</div>
<div id="stage"></div>
<div id="bar">
  <div id="desc"></div>
  <div id="btns"></div>
</div>

<script>
(() => {
  const HOLD_MS = 4000;   // 每首诗停留时长

  // 十种效果：与设计稿「诗词轮换」的 EFFECTS 配置一致，
  // 描述文字取自「诗词转场效果对比」的选型稿
  const EFFECTS = {
    '风散': { desc: '逐字上飘、模糊消散', inName: 'charIn', outName: 'charOut', inDur: 640, outDur: 420, stagger: 34,
      inEase: 'cubic-bezier(0.16, 1, 0.3, 1)', outEase: 'cubic-bezier(0.7, 0, 0.84, 0)' },
    '墨晕': { desc: '原地显影，像墨渗入纸', inName: 'inkIn', outName: 'inkOut', inDur: 950, outDur: 620, stagger: 42,
      inEase: 'cubic-bezier(0.22, 1, 0.36, 1)', outEase: 'cubic-bezier(0.55, 0, 0.55, 0.2)' },
    '翻牌': { desc: '3D 翻转，像机场翻牌钟', inName: 'flipIn', outName: 'flipOut', inDur: 560, outDur: 400, stagger: 46,
      inEase: 'cubic-bezier(0.34, 1.3, 0.64, 1)', outEase: 'cubic-bezier(0.5, 0, 0.75, 0)' },
    '升帘': { desc: '沿行内升降，干净利落', inName: 'riseIn', outName: 'riseOut', inDur: 700, outDur: 520, stagger: 28,
      inEase: 'cubic-bezier(0.16, 1, 0.3, 1)', outEase: 'cubic-bezier(0.7, 0, 0.84, 0)', clip: true },
    '漂散': { desc: '随机方向漂离、聚合', inName: 'scatterIn', outName: 'scatterOut', inDur: 780, outDur: 560, stagger: 30,
      inEase: 'cubic-bezier(0.22, 1, 0.36, 1)', outEase: 'cubic-bezier(0.6, 0, 0.8, 0.4)', scatter: true },
    '弹跳': { desc: '逐字弹出，带过冲回弹', inName: 'popIn', outName: 'popOut', inDur: 520, outDur: 340, stagger: 40,
      inEase: 'cubic-bezier(0.34, 1.56, 0.64, 1)', outEase: 'cubic-bezier(0.36, 0, 0.66, -0.56)' },
    '故障': { desc: '信号错位、RGB 分离闪切', inName: 'glitchIn', outName: 'glitchOut', inDur: 460, outDur: 380, stagger: 16,
      inEase: 'steps(1, end)', outEase: 'steps(1, end)' },
    '打字': { desc: '逐字敲出，退场倒序删除', inName: 'typeIn', outName: 'typeOut', inDur: 60, outDur: 60, stagger: 85,
      inEase: 'steps(1, end)', outEase: 'steps(1, end)', reverseOut: true },
    '旋涡': { desc: '沿螺旋轨迹旋转聚合', inName: 'vortexIn', outName: 'vortexOut', inDur: 820, outDur: 600, stagger: 26,
      inEase: 'cubic-bezier(0.22, 1, 0.36, 1)', outEase: 'cubic-bezier(0.5, 0, 0.75, 0)', vortex: true },
    '坠落': { desc: '从上方落下带回弹，散落退场', inName: 'fallIn', outName: 'fallOut', inDur: 700, outDur: 480, stagger: 36,
      inEase: 'linear', outEase: 'cubic-bezier(0.5, 0, 0.75, 0)', fall: true },
  };

  const POEMS = [
    '春有百花秋有月|夏有凉风冬有雪',
    '闻说春醪熟，提壶唤客尝|乾坤一酿瓮，花气百和香',
    '人间有味是清欢|细雨斜风作晓寒',
    '晚来天欲雪|能饮一杯无',
  ].map((p) => p.split('|'));

  const stage = document.getElementById('stage');
  const descEl = document.getElementById('desc');
  const btnsEl = document.getElementById('btns');

  let effectName = '风散';
  let idx = 0;
  let phase = 'in';
  let timer = null;

  const rand = (seed) => {
    const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
    return x - Math.floor(x);
  };
  const charCount = (poem) => poem.reduce((n, line) => n + [...line].length, 0);
  const exitTotalMs = () => {
    const cfg = EFFECTS[effectName];
    return cfg.outDur + charCount(POEMS[idx]) * cfg.stagger;
  };

  const render = () => {
    const cfg = EFFECTS[effectName];
    const poem = POEMS[idx];
    const total = charCount(poem);
    stage.innerHTML = '';
    let i = 0;
    for (const line of poem) {
      const div = document.createElement('div');
      div.className = 'line';
      div.style.overflow = cfg.clip ? 'hidden' : 'visible';
      for (const c of [...line]) {
        const n = i++;
        const span = document.createElement('span');
        span.className = 'ch';
        span.textContent = c === ' ' ? ' ' : c;
        const delay = (phase === 'out' && cfg.reverseOut ? (total - 1 - n) : n) * cfg.stagger;
        span.style.animation = phase === 'in'
          ? `${cfg.inName} ${cfg.inDur}ms ${cfg.inEase} ${delay}ms both`
          : `${cfg.outName} ${cfg.outDur}ms ${cfg.outEase} ${delay}ms both`;
        const seed = idx * 100 + n * 3 + (phase === 'in' ? 0 : 1);
        if (cfg.scatter) {
          span.style.setProperty('--dx', ((rand(seed) - 0.5) * 180).toFixed(1) + 'px');
          span.style.setProperty('--dy', ((rand(seed + 1) - 0.5) * 140).toFixed(1) + 'px');
          span.style.setProperty('--rot', ((rand(seed + 2) - 0.5) * 36).toFixed(1) + 'deg');
        }
        if (cfg.vortex) {
          const ang = (n * 137.5 + idx * 61) * Math.PI / 180;
          const r = 130 + rand(seed) * 110;
          span.style.setProperty('--dx', (Math.cos(ang) * r).toFixed(1) + 'px');
          span.style.setProperty('--dy', (Math.sin(ang) * r * 0.7).toFixed(1) + 'px');
          span.style.setProperty('--rot', ((rand(seed + 2) - 0.5) * 400).toFixed(1) + 'deg');
        }
        if (cfg.fall) {
          span.style.setProperty('--rot', ((rand(seed + 2) - 0.5) * 50).toFixed(1) + 'deg');
        }
        if (cfg.inName === 'flipIn') {
          span.style.transformOrigin = '50% 100%';
          span.style.backfaceVisibility = 'hidden';
        }
        div.appendChild(span);
      }
      stage.appendChild(div);
    }
  };

  const schedule = () => {
    clearTimeout(timer);
    if (phase === 'in') {
      timer = setTimeout(() => { phase = 'out'; render(); schedule(); }, HOLD_MS);
    } else {
      timer = setTimeout(() => {
        idx = (idx + 1) % POEMS.length;
        phase = 'in';
        render();
        schedule();
      }, exitTotalMs() + 80);
    }
  };

  const setEffect = (name) => {
    effectName = name;
    phase = 'in';
    descEl.textContent = name + ' — ' + EFFECTS[name].desc;
    for (const btn of btnsEl.children) btn.classList.toggle('active', btn.textContent === name);
    render();
    schedule();
  };

  for (const name of Object.keys(EFFECTS)) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = name;
    btn.addEventListener('click', () => setEffect(name));
    btnsEl.appendChild(btn);
  }

  setEffect('风散');
})();
</script>
</body>
</html>
